name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ and run unit tests inside Docker
        run: docker build -t gatherly:demo .
      - name: Prepare disposable Compose environment
        run: |
          mkdir -p .local
          umask 077
          {
            echo GATHERLY_IMAGE=gatherly:demo
            echo HTTP_BIND=127.0.0.1
            echo HTTP_PORT=18080
            echo HTTPS_PORT=18443
            echo GRAFANA_PORT=13000
            echo POSTGRES_PASSWORD=$(openssl rand -hex 32)
            echo GATHERLY_AUTH_SECRET=$(openssl rand -hex 32)
            echo GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 32)
          } > .local/smoke.env
      - name: Start production Compose
        run: docker compose -p gatherly-check --env-file .local/smoke.env -f docker-compose.prod.yml up -d --wait --wait-timeout 180
      - name: HTTP, PostgreSQL faults, recovery, backup and monitoring tests
        run: python3 scripts/integration.py
      - name: Print service logs on failure
        if: failure()
        run: docker compose -p gatherly-check --env-file .local/smoke.env -f docker-compose.prod.yml logs --tail 100
      - name: Remove disposable stack
        if: always()
        run: docker compose -p gatherly-check --env-file .local/smoke.env -f docker-compose.prod.yml down -v
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: sudo apt-get update && sudo apt-get install -y ansible
      - run: ansible-playbook -i infra/ansible/inventory.ini.example infra/ansible/deploy.yml --syntax-check
      - run: node --check static/app.js
  publish:
    needs: [build-test, infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
