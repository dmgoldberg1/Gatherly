name: Prepare Gatherly benchmark access
description: Install tools and materialize private cloud and SSH credentials
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: bench/requirements-actions.txt
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.1
        terraform_wrapper: false
    - shell: bash
      run: python -m pip install -r bench/requirements-actions.txt
    - shell: bash
      run: python bench/actions_setup.py
