x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  gatherly:
    <<: *runtime
    image: ${GATHERLY_IMAGE:?Set GATHERLY_IMAGE}
    environment:
      GATHERLY_DATABASE_URL: postgresql://gatherly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gatherly
      GATHERLY_AUTH_SECRET: ${GATHERLY_AUTH_SECRET:?Set GATHERLY_AUTH_SECRET}
    volumes:
      - gatherly_media:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
  worker:
    <<: *runtime
    image: ${GATHERLY_WORKER_IMAGE:-gatherly-worker:demo}
    environment:
      GATHERLY_DATABASE_URL: postgresql://gatherly:${POSTGRES_PASSWORD}@postgres:5432/gatherly
      GATHERLY_DB_POOL_SIZE: "2"
    volumes: [gatherly_media:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 2g
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatherly
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly -d gatherly"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: gatherly
      PGDATABASE: gatherly
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
  nginx:
    <<: *runtime
    image: nginx:1.28-alpine
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80", "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
      - ./acme:/var/www/acme:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      gatherly:
        condition: service_healthy
    mem_limit: 64m
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.13.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./infra/monitoring:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 256m
  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 512m
  node-exporter:
    <<: *runtime
    image: prom/node-exporter:v1.10.2
    pid: host
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host/root", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 64m
  postgres-exporter:
    <<: *runtime
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: postgresql://gatherly:${POSTGRES_PASSWORD}@postgres:5432/gatherly?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  gatherly_media:
