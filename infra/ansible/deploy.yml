- name: Deploy Gatherly demo
  hosts: gatherly
  become: true
  vars:
    gatherly_root: /opt/gatherly
    repository_root: "{{ playbook_dir }}/../.."
    domain: ""
    letsencrypt_email: ""
    enable_https: false
    image_archive: ""
    worker_image_archive: ""
    gatherly_worker_image: gatherly-worker:demo
  roles:
    - docker
    - gatherly
